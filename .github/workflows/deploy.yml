name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy bundle
        run: |
          mkdir -p _deploy/v7 _deploy/new_pancadai/v2 _deploy/new_pancadai/v3 _deploy/new_pancadai/v4 _deploy/new_pancadai/v5 _deploy/new_pancadai/v6 _deploy/new_pancadai/v7 _deploy/v9 _deploy/new_pancadai/v9 _deploy/v10 _deploy/new_pancadai/v10 _deploy/new_pancadai/v8 _deploy/v11 _deploy/new_pancadai/v11 _deploy/v12 _deploy/new_pancadai/v12 _deploy/new_pancadai/assets/previews _deploy/pancadai/CRM
          cp new_pancadai/index.html _deploy/new_pancadai/index.html
          cp -r new_pancadai/assets/previews/. _deploy/new_pancadai/assets/previews/
          cp -r new_pancadai/v2/. _deploy/new_pancadai/v2/
          cp -r new_pancadai/v3/. _deploy/new_pancadai/v3/
          cp -r new_pancadai/v4/. _deploy/new_pancadai/v4/
          cp -r new_pancadai/v5/. _deploy/new_pancadai/v5/
          cp -r new_pancadai/v6/. _deploy/new_pancadai/v6/
          cp -r new_pancadai/v7/. _deploy/v7/
          cp -r new_pancadai/v7/. _deploy/new_pancadai/v7/
          cp -r new_pancadai/v8/. _deploy/new_pancadai/v8/
          cp -r new_pancadai/v9/. _deploy/v9/
          cp -r new_pancadai/v9/. _deploy/new_pancadai/v9/
          cp -r new_pancadai/v10/. _deploy/v10/
          cp -r new_pancadai/v10/. _deploy/new_pancadai/v10/
          cp -r new_pancadai/v11/. _deploy/v11/
          cp -r new_pancadai/v11/. _deploy/new_pancadai/v11/
          cp -r new_pancadai/v12/. _deploy/v12/
          cp -r new_pancadai/v12/. _deploy/new_pancadai/v12/
          cp -r pancadai/tripfee2/. _deploy/
          cp -r pancadai/CRM/. _deploy/pancadai/CRM/
          # 臻晟健康顧問官網
          mkdir -p _deploy/newcompany
          cp -r newcompany/. _deploy/newcompany/
          # 其他專案目錄（也經 gh-pages 分支部署）
          for d in CV FEMHICON FETHEALTH NTUH_PancreasCare PancreasCare SKH_RT digitaltwin femh femhlinemini indoor nursedashboard worker yminghospital; do
            mkdir -p "_deploy/$d"
            cp -r "$d/." "_deploy/$d/"
          done
          echo "health.yangkaichun.net" > _deploy/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
