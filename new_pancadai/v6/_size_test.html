<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>尺寸測試頁 — v6.0.21</title>
<style>
  body { font-family: sans-serif; background: #fff4e3; margin: 0; padding: 40px; }
  .card { background: #fff; border: 1px solid rgba(236,112,0,.3); border-radius: 20px; padding: 30px; margin-bottom: 30px; max-width: 700px; }
  .lbl { display: block; margin-top: 12px; font-size: 14px; color: #6b7280; }
  h3 { margin: 0 0 10px; color: #1d2530; }
  .info { background: #1d2530; color: #fff; padding: 16px 20px; border-radius: 12px; font-size: 15px; line-height: 1.8; margin-bottom: 30px; }
</style>
</head>
<body>
<div class="info" id="info">載入中...</div>

<div class="card">
  <h3>測試 A：inline 104px（數字帶目前的寫法）</h3>
  <b style="font-size:104px;font-size:clamp(96px,8.5vw,128px);white-space:nowrap">92.1<i style="font-size:1em">%</i></b>
  <span class="lbl">標籤 14px（設計小字，與數字無關）</span>
</div>

<div class="card">
  <h3>測試 B：固定 200px（超大）</h3>
  <b style="font-size:200px;white-space:nowrap">92.1<i style="font-size:1em">%</i></b>
  <span class="lbl">200px 應該非常巨大</span>
</div>

<div class="card">
  <h3>測試 C：固定 16px（預設大小）</h3>
  <b style="font-size:16px">92.1%</b>
  <span class="lbl">16px 才是「小」的基準</span>
</div>

<script>
  var ua = navigator.userAgent;
  var vw = window.innerWidth;
  var info = document.getElementById('info');
  info.innerHTML = '你的視窗寬度：<b>' + vw + 'px</b>（如果 &lt;=767 會套用手機版規則）<br>' +
    '瀏覽器：' + ua.slice(0, 90) + '<br>' +
    'clamp 支援測試：' + (CSS.supports('font-size', 'clamp(10px, 2vw, 20px)') ? '<b style="color:#7ee787">支援 ✓</b>' : '<b style="color:#ff7b72">不支援 ✗（這會是主因！）</b>');
</script>
</body>
</html>
