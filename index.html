    <script src="config.js"></script>
    <script>
        // ✅ 自動清除舊版快取：版本號變更時自動清除 localStorage
        const APP_VERSION = '1.2';
        const storedVersion = localStorage.getItem('app_version');
        if (storedVersion !== APP_VERSION) {
            localStorage.clear();
            localStorage.setItem('app_version', APP_VERSION);
        }

        let currentUser = null;
        let selectedFiles = [];

        // 登入驗證處理 (已修正 JWT 解碼的 Bug)
        function handleCredentialResponse(response) {
            // 🛡️ 第一步：檢查 CONFIG 是否存在
            if (typeof CONFIG === 'undefined') {
                alert('系統錯誤：config.js 未正確載入！請按 Ctrl+Shift+R 強制重新整理清除快取後再試。');
                console.error('CONFIG is undefined — config.js 可能未正確載入或含有語法錯誤');
                return;
            }
            
            let payload;
            try {
                const token = response.credential;
                if (!token || typeof token !== 'string') {
                    throw new Error('無效的登入憑證');
                }
                
                const parts = token.split('.');
                if (parts.length !== 3) {
                    throw new Error('JWT 格式錯誤');
                }
                const base64Url = parts[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const padded = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, '=');
                const jsonPayload = decodeURIComponent(atob(padded).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                payload = JSON.parse(jsonPayload);
                
                if (!payload.email) {
                    throw new Error('JWT payload 缺少 email 欄位');
                }
            } catch (jwtErr) {
                alert('登入資料解析失敗，請按 Ctrl+Shift+R 強制重新整理後再試。');
                console.error('JWT Decode Error:', jwtErr);
                return;
            }
            
            document.getElementById('submitBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span> 驗證權限中...';
            
            fetch(CONFIG.GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', email: payload.email })
            }).then(res => {
                return res.json().catch(() => {
                    throw new Error('GAS 回應不是 JSON，請確認 GAS 專案已重新部署為「網路應用程式」');
                });
            }).then(data => {
                if(data.status === 'success') {
                    currentUser = { name: data.name, role: data.role, phone: data.phone, email: payload.email };
                    localStorage.setItem('userEmail', payload.email);
                    localStorage.setItem('pancad_user', JSON.stringify(currentUser));
                    
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('applicant').value = data.name;
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('submitBtn').innerHTML = '<i class="bi bi-cloud-arrow-up"></i> 送出申請並產生 PDF';
                    
                    if(document.getElementById('detailsContainer').children.length === 0) {
                        addDetailRow(); 
                    }
                } else {
                    alert(`登入失敗：您的帳號 (${payload.email}) 未登記在系統權限名單中！`);
                    document.getElementById('submitBtn').innerHTML = '無權限';
                }
            }).catch(err => {
                alert('連線失敗：請確認 config.js 中的 GAS 網址是否正確且已重新部署。\n\n詳細錯誤：' + err.message);
                console.error('Fetch Error:', err);
            });
        }

        function calcDays() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            if(start && end && end >= start) {
                const diffTime = Math.abs(end - start);
                document.getElementById('totalDays').value = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
            } else {
                document.getElementById('totalDays').value = '';
            }
        }

        function addDetailRow() {
            const container = document.getElementById('detailsContainer');
            if(container.children.length >= 10) return alert('最多只能新增 10 筆明細');
            const idx = container.children.length + 1;
            
            const rowDiv = document.createElement('div');
            rowDiv.className = 'detail-card detail-row';
            rowDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge-detail">${idx}</span>
                    <button type="button" class="btn-close" onclick="this.parentElement.parentElement.remove(); calculateTotal();">&times;</button>
                </div>
                <div class="d-flex gap-2 mb-2 align-items-end flex-wrap">
                    <div style="flex:0 0 140px;">
                        <span class="row-label">日期</span>
                        <input type="date" class="detail-row-date i-date" required>
                    </div>
                    <div class="loc-input" style="flex:1;min-width:80px;">
                        <span class="row-label">起點</span>
                        <input type="text" class="form-control form-control-sm i-start" placeholder="起點">
                    </div>
                    <div style="padding-bottom:8px;color:var(--text-muted);">→</div>
                    <div class="loc-input" style="flex:1;min-width:80px;">
                        <span class="row-label">迄點</span>
                        <input type="text" class="form-control form-control-sm i-end" placeholder="迄點">
                    </div>
                </div>
                <div class="mb-2">
                    <span class="row-label">訪洽對象及工作紀要</span>
                    <input type="text" class="form-control form-control-sm i-desc" required placeholder="請輸入訪洽對象與摘要">
                </div>
                <div class="fee-tiles-wrap">
                    <div class="fee-tile" data-cat="飛機" data-amt="0">
                        <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                        <select class="fee-cat" onchange="calculateTotal()">
                            <option value="飛機">✈ 飛機</option>
                            <option value="高鐵">🚄 高鐵</option>
                        </select>
                        <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
                    </div>
                    <div class="fee-tile" data-cat="開車" data-amt="0">
                        <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                        <select class="fee-cat" onchange="calculateTotal()">
                            <option value="開車">🚗 開車</option>
                            <option value="計程車">🚕 計程車</option>
                        </select>
                        <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
                    </div>
                    <div class="fee-tile" data-cat="火車" data-amt="0">
                        <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                        <select class="fee-cat" onchange="calculateTotal()">
                            <option value="火車">🚂 火車</option>
                            <option value="捷運">🚇 捷運</option>
                        </select>
                        <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
                    </div>
                    <div class="fee-tile" data-cat="住宿費" data-amt="0">
                        <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                        <select class="fee-cat" onchange="calculateTotal()">
                            <option value="住宿費">🏨 住宿費</option>
                        </select>
                        <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
                    </div>
                    <div class="fee-tile" data-cat="膳雜費" data-amt="0">
                        <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                        <select class="fee-cat" onchange="calculateTotal()">
                            <option value="膳雜費">🍽 膳雜費</option>
                        </select>
                        <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
                    </div>
                    <div class="fee-tile" data-cat="其他費用" data-amt="0">
                        <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                        <select class="fee-cat" onchange="calculateTotal()">
                            <option value="其他費用">📦 其他</option>
                        </select>
                        <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
                    </div>
                    <button type="button" class="btn-add-tile" onclick="addFeeTile(this)">
                        <i class="bi bi-plus-lg"></i> 費用
                    </button>
                </div>
                <div class="row mt-2"><div class="col-12 text-end text-danger fw-bold small">單筆小計: $<span class="i-subtotal">0</span></div></div>
            `;
            container.appendChild(rowDiv);
        }

        function addFeeTile(btn) {
            const wrap = btn.closest('.fee-tiles-wrap');
            const tile = document.createElement('div');
            tile.className = 'fee-tile';
            tile.innerHTML = `
                <button type="button" class="tile-remove" onclick="this.closest('.fee-tile').remove();calculateTotal();">&times;</button>
                <select class="fee-cat" onchange="calculateTotal()">
                    <option value="飛機">✈ 飛機</option>
                    <option value="高鐵">🚄 高鐵</option>
                    <option value="開車">🚗 開車</option>
                    <option value="計程車">🚕 計程車</option>
                    <option value="火車">🚂 火車</option>
                    <option value="捷運">🚇 捷運</option>
                    <option value="住宿費">🏨 住宿費</option>
                    <option value="膳雜費">🍽 膳雜費</option>
                    <option value="其他費用">📦 其他</option>
                </select>
                <input type="number" class="fee-amt" placeholder="金額" min="0" oninput="calculateTotal()">
            `;
            wrap.insertBefore(tile, btn);
        }

        function getFeeData(row) {
            const map = { plane:0, taxi:0, train:0, hotel:0, meal:0, other:0 };
            let subtotal = 0;
            row.querySelectorAll('.fee-tile').forEach(tile => {
                const cat = tile.querySelector('.fee-cat').value;
                const amt = parseInt(tile.querySelector('.fee-amt').value) || 0;
                subtotal += amt;
                if (cat === '飛機' || cat === '高鐵') map.plane += amt;
                else if (cat === '開車' || cat === '計程車') map.taxi += amt;
                else if (cat === '火車' || cat === '捷運') map.train += amt;
                else if (cat === '住宿費') map.hotel += amt;
                else if (cat === '膳雜費') map.meal += amt;
                else map.other += amt;
            });
            return { ...map, subtotal };
        }

        function calculateTotal() {
            let grandTotal = 0;
            document.querySelectorAll('.detail-row').forEach(row => {
                const { subtotal } = getFeeData(row);
                row.querySelector('.i-subtotal').innerText = subtotal;
                grandTotal += subtotal;
            });
            document.getElementById('totalAmount').value = grandTotal;
        }

        async function handleFiles(event) {
            const files = event.target.files;
            const previewArea = document.getElementById('previewArea');
            for(let i=0; i<files.length; i++) {
                let file = files[i];
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64String = e.target.result;
                    let mimeType = file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : '');
                    
                    selectedFiles.push({ name: file.name, mimeType: mimeType, base64: base64String });
                    let div = document.createElement('div');
                    div.className = 'file-preview';
                    
                    let content = mimeType.startsWith('image') ? 
                        `<img src="${base64String}" class="preview-img">` : 
                        `<div class="preview-img d-flex align-items-center justify-content-center" style="background:var(--bg-light);"><i class="bi bi-file-earmark-pdf text-danger" style="font-size:24px;"></i></div>`;
                    
                    div.innerHTML = `${content}<button type="button" class="btn-close" style="position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--border-light);border-radius:50%;width:18px;height:18px;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:1;" onclick="removeFile(${selectedFiles.length - 1}, this)">&times;</button><div class="small text-truncate" style="width:60px;text-align:center;margin-top:2px;font-size:10px;color:var(--text-muted);">${file.name}</div>`;
                    previewArea.appendChild(div);
                };
                reader.readAsDataURL(file);
            }
            event.target.value = ''; 
        }

        function removeFile(index, btnElement) {
            selectedFiles[index] = null; 
            btnElement.parentElement.remove();
        }

        document.getElementById('expenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 處理中，請勿關閉網頁...';

            let details = [];
            document.querySelectorAll('.detail-row').forEach(row => {
                const dateVal = row.querySelector('.i-date').value;
                const dateParts = dateVal ? dateVal.split('-') : [];
                const feeData = getFeeData(row);
                details.push({
                    month: dateParts[1] || '',
                    day: dateParts[2] || '',
                    startLoc: row.querySelector('.i-start').value,
                    endLoc: row.querySelector('.i-end').value,
                    desc: row.querySelector('.i-desc').value,
                    plane: feeData.plane || '',
                    taxi: feeData.taxi || '',
                    train: feeData.train || '',
                    hotel: feeData.hotel || '',
                    meal: feeData.meal || '',
                    other: feeData.other || '',
                    subtotal: row.querySelector('.i-subtotal').innerText
                });
            });

            const payload = {
                action: 'submit',
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                totalDays: document.getElementById('totalDays').value,
                department: document.getElementById('department').value,
                applicant: document.getElementById('applicant').value,
                phone: document.getElementById('phone').value,
                summary: document.getElementById('summary').value,
                totalAmount: document.getElementById('totalAmount').value,
                details: details,
                files: selectedFiles.filter(f => f !== null)
            };

            try {
                const response = await fetch(CONFIG.GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                
                if(result.success) {
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 正在合併憑證，請稍候...';
                    
                    const { PDFDocument } = PDFLib;
                    const mainPdfBytes = Uint8Array.from(atob(result.base64Pdf), c => c.charCodeAt(0));
                    const mergedPdf = await PDFDocument.load(mainPdfBytes);
                    
                    for (let file of selectedFiles.filter(f => f !== null)) {
                        try {
                            if (file.mimeType.includes('pdf')) {
                                const attachBytes = Uint8Array.from(atob(file.base64.split(',')[1]), c => c.charCodeAt(0));
                                const attachDoc = await PDFDocument.load(attachBytes);
                                const copiedPages = await mergedPdf.copyPages(attachDoc, attachDoc.getPageIndices());
                                copiedPages.forEach(page => mergedPdf.addPage(page));
                            } else if (file.mimeType.startsWith('image')) {
                                const imgBytes = Uint8Array.from(atob(file.base64.split(',')[1]), c => c.charCodeAt(0));
                                let pdfImage = file.mimeType.includes('png') ? await mergedPdf.embedPng(imgBytes) : await mergedPdf.embedJpg(imgBytes);
                                const page = mergedPdf.addPage();
                                const { width, height } = page.getSize();
                                const scaled = pdfImage.scaleToFit(width - 40, height - 40);
                                page.drawImage(pdfImage, { x: width/2 - scaled.width/2, y: height/2 - scaled.height/2, width: scaled.width, height: scaled.height });
                            }
                        } catch(e) { console.log('附件合併發生錯誤 (可能為密碼保護)：', e); }
                    }
                    
                    const finalPdfBytes = await mergedPdf.save();
                    
                    // ── 將合併後的 PDF 存回 Google Drive ──
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 正在存檔到雲端...';
                    try {
                        const bytes = new Uint8Array(finalPdfBytes);
                        let binary = '';
                        for (let i = 0; i < bytes.byteLength; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        const finalPdfBase64 = btoa(binary);
                        
                        const saveDetails = details.map(d => ({
                            date: (d.month && d.day) ? `${d.month}/${d.day}` : '',
                            description: [d.desc, d.startLoc && d.endLoc ? `${d.startLoc}→${d.endLoc}` : ''].filter(Boolean).join(' '),
                            price: [d.plane, d.taxi, d.train, d.hotel, d.meal, d.other].reduce((s, v) => s + (parseInt(v)||0), 0),
                            quantity: 1,
                            subtotal: parseInt(d.subtotal) || 0
                        }));
                        
                        await fetch(CONFIG.GAS_API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'saveRecord',
                                formId: result.formId,
                                department: document.getElementById('department').value,
                                applicantName: document.getElementById('applicant').value,
                                phone: document.getElementById('phone').value,
                                summary: document.getElementById('summary').value,
                                totalAmount: document.getElementById('totalAmount').value,
                                details: saveDetails,
                                finalPdfBase64: finalPdfBase64
                            })
                        });
                    } catch(saveErr) {
                        console.warn('雲端存檔失敗（PDF 仍會下載）:', saveErr);
                    }
                    
                    const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
                    const url = window.URL.createObjectURL(blob);
                    
                    // Show PDF in modal
                    const modal = document.getElementById('pdfModal');
                    const iframe = document.getElementById('pdfIframe');
                    const downloadBtn = document.getElementById('pdfDownloadBtn');
                    
                    iframe.src = url;
                    modal.classList.add('active');
                    
                    downloadBtn.onclick = () => {
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${result.formId}_出差旅費申報單.pdf`;
                        a.click();
                    };
                    
                    window.closePdfModal = () => {
                        modal.classList.remove('active');
                        setTimeout(() => {
                            window.location.reload();
                        }, 300);
                    };

                } else {
                    alert('伺服器錯誤: ' + result.message);
                }
            } catch (error) { 
                alert('傳送或合併失敗，請檢查網路連線。' + error); 
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up"></i> 送出申請並產生 PDF';
            }
        });
    </script>
</body>
</html>
